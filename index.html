<style>
:root{
  --head:"Bricolage Grotesque","Figtree",system-ui,sans-serif;
  --font:"Figtree",system-ui,-apple-system,sans-serif;
  --bg:#F7F3EF; --surface:#FFFFFF; --surface2:#EEE8E2; --surface3:#E2DAD2;
  --ink:#1A1410; --ink2:#3A322C; --muted:#6F655D; --faint:#A89E95; --line:#ECE5DE;
  --acc:#178A5A; --acc-dark:#0F6E47; --acc-soft:#E3F4EA; --acc-light:#7DDBA6; --warn:#D9401C;
  --saffron:#FFB627; --basil:#22A06B; --basil-soft:#E1F5EA; --plum:#8E5BE8; --berry:#E85D9C; --sky:#2E7CF6;
  --shadow:0 1px 2px rgba(40,20,5,.05),0 6px 18px rgba(40,20,5,.06);
  --shadow-lg:0 2px 6px rgba(60,30,10,.06),0 18px 44px rgba(60,30,10,.14);
  --nav:rgba(255,255,255,.86);
  --r:24px;
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
}
html[data-theme=dark]{color-scheme:dark;
  --bg:#141210; --surface:#1E1B18; --surface2:#2A2622; --surface3:#36302B;
  --ink:#FBF6F0; --ink2:#E8E0D6; --muted:#B0A598; --faint:#7B7268; --line:#2E2925;
  --acc:#1F9D66; --acc-soft:#14301F; --basil-soft:#12301F; --warn:#FF9B80;
  --shadow:none; --shadow-lg:0 18px 44px rgba(0,0,0,.4); --nav:rgba(30,27,24,.8);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:500 16px/1.5 var(--font);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
h1,h2,h3{margin:0;font-family:var(--head);letter-spacing:-.025em}
.wrap{max-width:980px;margin:0 auto;padding:calc(14px + var(--safe-t)) 20px calc(130px + var(--safe-b))}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.hidden{display:none!important}
.muted{color:var(--muted)}
.fade{animation:fade .35s cubic-bezier(.2,.8,.2,1)}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ---------- top bar ---------- */
.top{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.logo{display:flex;align-items:center;gap:10px;font:800 21px var(--head);letter-spacing:-.03em}
.logo .mark{width:36px;height:36px;border-radius:11px;background:var(--acc);display:grid;place-items:center;color:#fff}
.logo .mark svg{width:22px;height:22px}
.top .sp{flex:1}
.iconbtn{border:0;background:var(--surface2);width:40px;height:40px;border-radius:50%;display:grid;place-items:center;cursor:pointer;flex:none;transition:transform .15s}
.iconbtn:active{transform:scale(.92)}
.iconbtn svg{width:20px;height:20px}
.demo-badge{font:700 11px var(--font);background:var(--saffron);color:#3B2600;padding:4px 10px;border-radius:99px;letter-spacing:.02em}

/* ---------- greeting ---------- */
.greet{margin:22px 0 18px}
.greet .date{font:600 13px var(--font);color:var(--muted);text-transform:capitalize}
.greet h1{font-size:clamp(32px,6vw,44px);line-height:1.05;margin-top:4px}
.greet h1 em{font-style:normal;color:var(--acc)}

/* ---------- search ---------- */
html[data-theme=dark] .thumb,html[data-theme=dark] .dhero,html[data-theme=dark] .photo-pick .pv{background:var(--g)}
.search{display:flex;align-items:center;gap:10px;background:var(--surface);border-radius:999px;padding:0 18px;height:52px;box-shadow:var(--shadow);border:1px solid transparent}
html[data-theme=dark] .search{border-color:var(--line)}
.search svg{width:20px;height:20px;color:var(--muted);flex:none}
.search input{border:0;outline:0;background:none;flex:1;font:600 16px var(--font);min-width:0}
.search input::placeholder{color:var(--faint)}

/* ---------- section ---------- */
.sec{display:flex;align-items:baseline;justify-content:space-between;margin:34px 0 14px}
.sec h2{font-size:24px}
.sec a{font:700 14px var(--font);color:var(--acc)}

/* ---------- hero occasion ---------- */
.hero{position:relative;overflow:hidden;border-radius:30px;padding:24px;color:#fff;background:linear-gradient(135deg,#127A4F 0%,#22A06B 55%,#7CCB8F 100%);display:flex;gap:18px;align-items:center;cursor:pointer;box-shadow:var(--shadow-lg)}
.hero::before{content:"";position:absolute;right:-70px;top:-90px;width:260px;height:260px;border-radius:50%;background:rgba(255,255,255,.14)}
.hero::after{content:"";position:absolute;right:60px;bottom:-110px;width:200px;height:200px;border-radius:50%;background:rgba(255,255,255,.1)}
.hero .big{font-size:58px;line-height:1;flex:none;position:relative;z-index:1;filter:drop-shadow(0 6px 14px rgba(0,0,0,.18))}
.hero .txt{position:relative;z-index:1;min-width:0}
.hero .k{font:700 12px var(--font);text-transform:uppercase;letter-spacing:.08em;opacity:.9}
.hero h3{font-size:24px;line-height:1.15;margin:4px 0 6px}
.hero p{margin:0;font-weight:600;opacity:.95}
.hero .cd{position:relative;z-index:1;margin-left:auto;text-align:center;background:rgba(255,255,255,.2);backdrop-filter:blur(6px);border-radius:20px;padding:10px 16px;flex:none}
.hero .cd b{display:block;font:800 30px/1 var(--head)}
.hero .cd span{font:700 11px var(--font);text-transform:uppercase;letter-spacing:.06em}
@media(max-width:560px){.hero{flex-wrap:wrap}.hero .cd{margin-left:0}}

/* ---------- category tiles ---------- */
.cats{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}
@media(max-width:760px){.cats{grid-template-columns:repeat(3,1fr)}}
.cat{border:0;cursor:pointer;border-radius:22px;padding:16px 10px 14px;display:flex;flex-direction:column;align-items:center;gap:8px;background:var(--surface);box-shadow:var(--shadow);color:var(--ink);font:700 14px var(--font);transition:transform .15s}
.cat:active{transform:scale(.96)}
.cat .e{font-size:34px;line-height:1;width:58px;height:58px;border-radius:50%;display:grid;place-items:center;background:var(--acc-soft)}
html[data-theme=dark] .cat .e{background:var(--surface);box-shadow:none}
html[data-theme=dark] .cat{background:var(--surface2);box-shadow:none}
.cat small{font:600 12px var(--font);color:var(--muted)}

/* ---------- carousel & grid ---------- */
.rail{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -20px;padding:4px 20px 12px;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.rail .rc{width:230px;flex:none;scroll-snap-align:start}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
@media(max-width:520px){.grid{grid-template-columns:1fr 1fr;gap:12px}}

.rc{display:block;background:var(--surface);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow);border:1px solid transparent;cursor:pointer;transition:transform .2s,box-shadow .2s}
.rc:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg)}
.rc:active{transform:scale(.98)}
.thumb{position:relative;aspect-ratio:4/3;background:var(--gl,var(--g));display:grid;place-items:center;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb .em{font-size:64px;filter:drop-shadow(0 8px 16px rgba(0,0,0,.15));transform:rotate(-6deg)}
.thumb::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 85% 15%,rgba(255,255,255,.35),transparent 40%)}
.thumb .fav{position:absolute;top:10px;right:10px;z-index:2;width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.9);display:grid;place-items:center;font-size:15px}
.thumb .time{position:absolute;left:10px;bottom:10px;z-index:2;background:rgba(20,15,10,.62);color:#fff;backdrop-filter:blur(6px);font:700 12px var(--font);padding:4px 10px;border-radius:99px}
.rc .body{padding:12px 14px 14px}
.rc h4{margin:0;font:700 16px/1.25 var(--font);letter-spacing:-.01em;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.rc .meta{display:flex;gap:6px;align-items:center;margin-top:6px;font:600 12px var(--font);color:var(--muted);flex-wrap:wrap}
.stars{color:var(--saffron);letter-spacing:1px}

/* ---------- chips ---------- */
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px 0 4px}
.chips::-webkit-scrollbar{display:none}
.chips.wrap-c{flex-wrap:wrap;overflow:visible}
.chip{display:inline-flex;align-items:center;gap:6px;border:0;background:var(--surface2);padding:9px 15px;border-radius:999px;font:700 14px var(--font);cursor:pointer;white-space:nowrap;flex:none;transition:background .2s,transform .15s,color .2s}
.chip:active{transform:scale(.96)}
.chip.on{background:var(--ink);color:#fff}
html:not([data-theme=dark]) .chip:not(.on):not(.ok){background:var(--surface);box-shadow:0 1px 2px rgba(40,20,5,.06),inset 0 0 0 1px var(--line)}
html[data-theme=dark] .chip.on{color:var(--bg)}
.chip.acc.on{background:var(--acc);color:#fff}
.chip.ok{background:var(--basil-soft);color:var(--basil)}
.chip.ok.on{background:var(--basil);color:#fff}
.chip .x{opacity:.6;font-weight:800}
.tag-type{background:var(--acc-soft)!important;color:var(--acc-dark)!important}
html[data-theme=dark] .tag-type{color:var(--acc-light)!important}
.tag{display:inline-flex;align-items:center;gap:4px;font:700 12px var(--font);padding:4px 10px;border-radius:99px;background:var(--surface2);color:var(--ink2)}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;background:var(--acc);color:#fff;font:700 15px var(--font);padding:14px 22px;border-radius:999px;cursor:pointer;transition:transform .15s,filter .15s}
.btn:hover{filter:brightness(1.05)}
.btn:active{transform:scale(.97)}
.btn svg{width:18px;height:18px}
.btn.ghost{background:var(--surface2);color:var(--ink)}
.btn.ink{background:var(--ink);color:var(--bg)}
.btn.ok{background:var(--basil)}
.btn.danger{background:transparent;color:#D63A2B;box-shadow:inset 0 0 0 1.5px currentColor}
.btn.sm{padding:9px 16px;font-size:14px}
.btn.wide{width:100%}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* ---------- bottom nav (floating glass) ---------- */
nav.tabs{position:fixed;left:50%;bottom:calc(14px + var(--safe-b));transform:translateX(-50%);z-index:20;display:flex;align-items:center;gap:2px;padding:6px;background:var(--nav);backdrop-filter:blur(22px) saturate(180%);-webkit-backdrop-filter:blur(22px) saturate(180%);border-radius:999px;box-shadow:0 12px 34px rgba(40,20,5,.16),inset 0 0 0 1px rgba(127,127,127,.14)}
nav.tabs a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 14px;font:700 11px var(--font);color:var(--muted);border-radius:999px;min-width:62px}
nav.tabs a svg{width:23px;height:23px}
nav.tabs a.on{color:var(--acc)}
nav.tabs a.plus{background:var(--acc);color:#fff;width:52px;height:52px;min-width:0;padding:0;justify-content:center;margin:0 4px;box-shadow:0 6px 16px rgba(23,138,90,.4)}
nav.tabs a.plus svg{width:26px;height:26px}
@media(max-width:420px){nav.tabs a{min-width:54px;padding:7px 9px;font-size:10px}}
body.immersive nav.tabs{display:none}

/* ---------- recipe detail ---------- */
.dhero{position:relative;margin:-14px -20px 0;height:min(46vh,380px);background:var(--gl,var(--g));display:grid;place-items:center;overflow:hidden}
@media(min-width:760px){.dhero{margin:6px 0 0;border-radius:32px}}
.dhero img{width:100%;height:100%;object-fit:cover}
.dhero .em{font-size:130px;transform:rotate(-8deg);filter:drop-shadow(0 16px 30px rgba(0,0,0,.2))}
.dhero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.25),transparent 30%,transparent 70%,rgba(0,0,0,.15))}
.dhero .bar{position:absolute;top:calc(14px + var(--safe-t));left:16px;right:16px;display:flex;justify-content:space-between;z-index:2}
.dhero .iconbtn{background:rgba(255,255,255,.92);color:#1E1A16}
.dcard{position:relative;z-index:3;background:var(--bg);border-radius:30px 30px 0 0;margin:-34px -20px 0;padding:24px 20px 0}
@media(min-width:760px){.dcard{margin:-34px 24px 0;border-radius:30px;padding:26px 28px 6px;box-shadow:var(--shadow)}}
.dcard h1{font-size:clamp(28px,5vw,40px);line-height:1.08}
.facts{display:flex;gap:10px;margin:16px 0 4px;flex-wrap:wrap}
.fact{background:var(--surface2);border-radius:18px;padding:10px 14px;display:flex;align-items:center;gap:10px}
.fact .i{font-size:20px}
.fact b{display:block;font:800 16px/1.1 var(--font)}
.fact small{font:600 12px var(--font);color:var(--muted)}
.cols{display:grid;grid-template-columns:1fr;gap:6px}
@media(min-width:760px){.cols{grid-template-columns:5fr 7fr;gap:34px}}
.serv{display:flex;align-items:center;gap:6px;background:var(--surface2);border-radius:999px;padding:4px}
.serv button{border:0;width:36px;height:36px;border-radius:50%;background:var(--surface);font:800 18px var(--font);cursor:pointer;box-shadow:var(--shadow)}
.serv b{min-width:72px;text-align:center;font:800 15px var(--font)}
.ings{list-style:none;margin:10px 0 0;padding:0}
.ings li{display:flex;gap:12px;align-items:center;padding:12px 4px;border-bottom:1px solid var(--line);cursor:pointer;transition:opacity .2s}
.ings li .ck{width:24px;height:24px;border-radius:8px;border:2px solid var(--surface3);background:var(--surface);flex:none;display:grid;place-items:center;transition:all .2s}
.ings li.done{opacity:.45}
.ings li.done .ck{background:var(--basil);border-color:var(--basil);color:#fff}
.ings li.done .n{text-decoration:line-through}
.ings .q{font:800 15px var(--font);min-width:74px}
.steps{list-style:none;margin:10px 0 0;padding:0;counter-reset:s}
.steps li{position:relative;padding:4px 0 18px 50px;counter-increment:s}
.steps li::before{content:counter(s);position:absolute;left:0;top:0;width:34px;height:34px;border-radius:12px;background:var(--acc-soft);color:var(--acc-dark);display:grid;place-items:center;font:800 15px var(--font)}
html[data-theme=dark] .steps li::before{color:var(--acc-light)}
.note{background:#FFF6D9;color:#6B5200;border-radius:20px;padding:16px 18px;white-space:pre-wrap;font-weight:600}
html[data-theme=dark] .note{background:#2B2613;color:#F2D36B}
.rate{display:flex;gap:4px}
.rate button{border:0;background:none;font-size:28px;cursor:pointer;padding:0 2px;color:var(--surface3);transition:transform .15s}
.rate button.on{color:var(--saffron)}
.rate button:active{transform:scale(1.25)}
h3.lbl{font-size:21px;margin:28px 0 4px;display:flex;align-items:center;justify-content:space-between;gap:10px}

/* ---------- forms ---------- */
.form{display:grid;gap:18px;margin-top:18px}
.field label{display:block;font:700 13px var(--font);color:var(--muted);margin:0 0 7px 4px;text-transform:uppercase;letter-spacing:.05em}
.field .hint{font:600 13px var(--font);color:var(--faint);margin:6px 0 0 4px}
.in,textarea.in,select.in{width:100%;border:1.5px solid var(--line);background:var(--surface);border-radius:16px;padding:13px 15px;font:600 16px var(--font);outline:0;transition:border .2s}
.in:focus{border-color:var(--acc)}
textarea.in{min-height:120px;resize:vertical;line-height:1.55}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.photo-pick{display:flex;gap:14px;align-items:center}
.photo-pick .pv{width:96px;height:96px;border-radius:22px;background:var(--gl,var(--g,var(--surface2)));display:grid;place-items:center;overflow:hidden;font-size:46px;flex:none}
.photo-pick .pv img{width:100%;height:100%;object-fit:cover}
.emojis{display:flex;flex-wrap:wrap;gap:6px}
.emojis button{border:0;background:var(--surface2);width:42px;height:42px;border-radius:12px;font-size:22px;cursor:pointer}
.emojis button.on{background:var(--acc-soft);box-shadow:inset 0 0 0 2px var(--acc)}

/* ---------- lists / cards ---------- */
.card{background:var(--surface);border-radius:var(--r);padding:20px;box-shadow:var(--shadow);border:1px solid transparent}
html[data-theme=dark] .rc,html[data-theme=dark] .card,html[data-theme=dark] .occ{border-color:var(--line)}
.occ{display:flex;align-items:center;gap:14px;padding:16px;background:var(--surface);border-radius:22px;border:1px solid transparent;box-shadow:var(--shadow)}
.occ .d{width:58px;height:62px;border-radius:16px;background:var(--acc-soft);color:var(--acc-dark);display:flex;flex-direction:column;align-items:center;justify-content:center;flex:none}
html[data-theme=dark] .occ .d{color:var(--acc-light)}
.occ .d b{font:800 22px/1 var(--head)}
.occ .d span{font:800 11px var(--font);text-transform:uppercase}
.occ .t{flex:1;min-width:0}
.occ .t b{display:block;font:700 16px var(--font)}
.occ .t small{color:var(--muted);font-weight:600}
.stack{display:grid;gap:12px}
.log{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.log .ic{width:40px;height:40px;border-radius:12px;background:var(--surface2);display:grid;place-items:center;font-size:19px;flex:none}
.log b{font-weight:700}
.log small{display:block;color:var(--muted);font-weight:600}
.empty{text-align:center;padding:50px 20px;color:var(--muted)}
.empty .e{font-size:60px;margin-bottom:8px}
.empty h3{color:var(--ink);font-size:22px;margin-bottom:6px}
.pbar{height:6px;background:var(--surface2);border-radius:99px;overflow:hidden;margin-top:8px}
.pbar i{display:block;height:100%;background:var(--basil);border-radius:99px}
.miss{font:600 13px var(--font);color:var(--warn);margin-top:6px}

/* ---------- login ---------- */
.login{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:24px;background:
  radial-gradient(circle at 15% 10%,#CDEFD9 0,transparent 42%),radial-gradient(circle at 90% 88%,#FFE3C4 0,transparent 42%),var(--bg)}
html[data-theme=dark] .login{background:radial-gradient(circle at 15% 10%,#12301F 0,transparent 45%),radial-gradient(circle at 90% 85%,#3A2C0E 0,transparent 45%),var(--bg)}
.login .box{width:100%;max-width:380px;text-align:center}
.login .floaters{font-size:44px;display:flex;justify-content:center;gap:10px;margin-bottom:12px}
.login .floaters span{animation:bob 3s ease-in-out infinite}
.login .floaters span:nth-child(2){animation-delay:.4s}.login .floaters span:nth-child(3){animation-delay:.8s}
@keyframes bob{50%{transform:translateY(-8px) rotate(6deg)}}
.login h1{font-size:46px;letter-spacing:-.04em}
.login p{color:var(--muted);font-weight:600;margin:6px 0 26px}
.login .in{text-align:center;font-size:18px;height:56px;border-radius:999px}
.login .err{color:#D63A2B;font-weight:700;min-height:24px;margin:10px 0 0}
.login .hint{font:600 13px var(--font);color:var(--faint);margin-top:18px}

/* ---------- cooking mode ---------- */
.cook{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;padding:calc(18px + var(--safe-t)) 22px calc(22px + var(--safe-b))}
.cook .hd{display:flex;align-items:center;gap:12px}
.cook .prog{flex:1;display:flex;gap:4px}
.cook .prog i{flex:1;height:5px;border-radius:9px;background:var(--surface2)}
.cook .prog i.on{background:var(--acc)}
.cook .mid{flex:1;display:flex;flex-direction:column;justify-content:center;max-width:720px;margin:0 auto;width:100%}
.cook .n{font:800 15px var(--font);color:var(--acc);text-transform:uppercase;letter-spacing:.08em}
.cook .st{font:700 clamp(24px,4.6vw,38px)/1.3 var(--head);letter-spacing:-.02em;margin-top:10px}

function parseQty(s){
  if (!s) return null;
  s = s.replace(",", ".").replace("½",".5").replace("¼",".25").replace("¾",".75");
  if (/^\d+\/\d+$/.test(s)){ const [a,b] = s.split("/"); return +a / +b; }
  if (/^\d+ \d+\/\d+$/.test(s)){ const [w,f] = s.split(" "); const [a,b] = f.split("/"); return +w + a/b; }
  const n = parseFloat(s); return isNaN(n) ? null : n;
}
function parseIngredient(line){
  line = line.trim().replace(/^[-•*]\s*/, "");
  if (!line) return null;
  const m = line.match(/^(\d+\s\d+\/\d+|\d+\/\d+|\d+(?:[.,]\d+)?|[½¼¾])\s*(.*)$/);
  let q = null, rest = line, u = "";
  if (m){ q = parseQty(m[1].trim()); rest = m[2]; }
  const units = [...UNITS].sort((a,b) => b.length - a.length);
  for (const un of units){
    const re = new RegExp("^" + un.replace(/\./g,"\\.") + "(?=\\s|$)", "i");
    if (re.test(rest)){ u = un; rest = rest.slice(un.length).trim(); break; }
  }
  rest = rest.replace(/^(de |d')/i, "").trim();
  return {q, u, n: rest || line};
}

  const r = Math.round(q*4)/4, w = Math.floor(r), f = +(r-w).toFixed(2);
  if (r === 0) return String(+q.toFixed(2)).replace(".", ",");
  return (w ? w : "") + (f ? FR[f] : "") || "0";
}

/* ======================= Backend : démo (localStorage) ======================= */
function demoBackend(){
  const load = () => {
    const d = store.get("demo3", null);
    if (d) return d;
    const now = Date.now();
    return {recipes: [...STARTER, ...SEED].map((r,i) => ({...r, createdAt: now - i*86400000})), occasions: STARTER_OCC, pantry: {staples: DEFAULT_STAPLES}, logins: []};
  };
  let D = load();
  const persist = () => { store.set("demo3", D); pull(); };
  const pull = () => { S.recipes = D.recipes; S.occasions = D.occasions; S.pantry = D.pantry; S.logins = D.logins; render(); };
  return {
    async start(){
      if (sessionStorage.getItem("popote-demo-in")){ S.user = {email:"demo"}; S.lastSignIn = new Date(); pull(); logOpen("ouverture"); }
      else renderLogin();
    },
    async signIn(pw, email){ if (!pw) throw new Error("Tape n'importe quel mot de passe en démo"); sessionStorage.setItem("popote-demo-in","1"); S.user = {email:"demo"}; S.lastSignIn = new Date(); pull(); logOpen("connexion"); },
    async signOut(){ sessionStorage.removeItem("popote-demo-in"); S.user = null; renderLogin(); },
    async saveRecipe(r){ const i = D.recipes.findIndex(x => x.id === r.id); if (i >= 0) D.recipes[i] = r; else D.recipes.unshift(r); persist(); },
    async deleteRecipe(id){ D.recipes = D.recipes.filter(r => r.id !== id); persist(); },
    async saveOcc(o){ const i = D.occasions.findIndex(x => x.id === o.id); if (i >= 0) D.occasions[i] = o; else D.occasions.push(o); persist(); },
    async deleteOcc(id){ D.occasions = D.occasions.filter(o => o.id !== id); persist(); },
    async savePantry(p){ D.pantry = p; persist(); },
    async log(entry){ D.logins.unshift({...entry, at: new Date().toISOString()}); D.logins = D.logins.slice(0,60); store.set("demo3", D); S.logins = D.logins; },
    async importSeed(){ D.recipes = [...[...STARTER, ...SEED].map(r => ({...r, createdAt: Date.now()})), ...D.recipes.filter(r => ![...STARTER, ...SEED].some(s => s.id === r.id))]; persist(); },
    async reset(){ try { localStorage.removeItem("popote:demo3"); } catch(e){} D = load(); persist(); }
  };
}

/* ======================= Backend : Firebase ======================= */
function firebaseBackend(){
  const V = "11.0.2", B = `https://www.gstatic.com/firebasejs/${V}/`;
  let A, F, auth, db, an = null, ga = null, unsubs = [];
  return {
    async start(){
      const [appM, authM, fsM] = await Promise.all([import(B+"firebase-app.js"), import(B+"firebase-auth.js"), import(B+"firebase-firestore.js")]);
      A = authM; F = fsM;
      const app = appM.initializeApp(CONFIG.firebase);
      auth = A.getAuth(app);
      try { db = F.initializeFirestore(app, {localCache: F.persistentLocalCache({tabManager: F.persistentMultipleTabManager()})}); }
      catch(e){ db = F.getFirestore(app); }
      if (CONFIG.firebase.measurementId){
        try { an = await import(B+"firebase-analytics.js"); if (await an.isSupported()) ga = an.getAnalytics(app); } catch(e){}
      }
      A.onAuthStateChanged(auth, user => {
        unsubs.forEach(u => u()); unsubs = [];
        if (!user){ S.user = null; renderLogin(); return; }
        S.user = user;
        S.lastSignIn = user.metadata && user.metadata.lastSignInTime ? new Date(user.metadata.lastSignInTime) : null;
        const col = n => F.collection(db, n);
        unsubs.push(F.onSnapshot(col("recipes"), s => { S.recipes = s.docs.map(d => ({id:d.id, ...d.data()})); S.ready = true; render(); }));
        unsubs.push(F.onSnapshot(col("occasions"), s => { S.occasions = s.docs.map(d => ({id:d.id, ...d.data()})); render(); }));
        unsubs.push(F.onSnapshot(F.doc(db,"meta","pantry"), s => { if (s.exists()) S.pantry = {staples: DEFAULT_STAPLES, ...s.data()}; render(); }));
        unsubs.push(F.onSnapshot(F.query(col("logins"), F.orderBy("at","desc"), F.limit(60)), s => {
          S.logins = s.docs.map(d => { const x = d.data(); return {...x, at: x.at && x.at.toDate ? x.at.toDate().toISOString() : x.at}; });
          if (location.hash.startsWith("#/compte")) render();
        }));
        if (!S.justSignedIn) logOpen("ouverture");
        S.justSignedIn = false;
        render();
      });
    },
    async signIn(pw, email){
      S.justSignedIn = true;
      try {
        await A.setPersistence(auth, A.browserLocalPersistence);
        await A.signInWithEmailAndPassword(auth, email, pw);
        logOpen("connexion");
      } catch(e){
        S.justSignedIn = false;
        const c = (e && e.code) || "";
        const msg = /invalid-credential|wrong-password|invalid-login|user-not-found|invalid-email/.test(c) ? "Mot de passe incorrect"
          : /too-many-requests/.test(c) ? "Trop d'essais, réessaie dans quelques minutes"
          : /network-request-failed/.test(c) ? "Pas de connexion internet"
          : /api-key|referer|blocked/i.test(c + " " + (e.message||"")) ? "Accès bloqué pour ce site (clé API)"
          : "Connexion impossible (" + (c || "erreur inconnue") + ")";
        throw new Error(msg);
      }
    },
    async signOut(){ await A.signOut(auth); },
    async saveRecipe(r){ const {id, ...data} = r; await F.setDoc(F.doc(db,"recipes",id), data); },
    async deleteRecipe(id){ await F.deleteDoc(F.doc(db,"recipes",id)); },
    async saveOcc(o){ const {id, ...data} = o; await F.setDoc(F.doc(db,"occasions",id), data); },
    async deleteOcc(id){ await F.deleteDoc(F.doc(db,"occasions",id)); },
    async savePantry(p){ S.pantry = p; render(); await F.setDoc(F.doc(db,"meta","pantry"), p); },
    async log(entry){ await F.addDoc(F.collection(db,"logins"), {...entry, at: F.serverTimestamp()}); },
    async importSeed(){ for (const r of STARTER){ const {id, ...d} = r; await F.setDoc(F.doc(db,"recipes",id), {...d, createdAt: Date.now()}); } for (const o of STARTER_OCC){ const {id, ...d} = o; await F.setDoc(F.doc(db,"occasions",id), d); } },
    track(name, params){ if (ga && an) an.logEvent(ga, name, params || {}); }
  };
}

function logOpen(kind){
  const last = +store.get("lastLog", 0);
  if (kind === "ouverture" && Date.now() - last < 30*60*1000) return;
  store.set("lastLog", Date.now());
  const d = deviceInfo();
  const name = store.get("deviceName", "") || d.dev;
  backend.log({kind, device: name, model: d.dev, browser: d.br, app: d.app}).catch(()=>{});
  track(kind === "connexion" ? "login" : "app_open", {device: d.dev});
}
const track = (n,p) => { try { backend && backend.track && backend.track(n,p); } catch(e){} };

function filtered(){
  const q = key(S.q);
  return S.recipes.filter(r => {
    if (S.fType && r.type !== S.fType) return false;
    if (S.fTags.length && !S.fTags.every(t => (r.tags||[]).includes(t))) return false;
    if (S.fSeason && !(r.seasons||[]).includes(S.fSeason)) return false;
    if (q){
      const hay = key(r.title + " " + (r.ingredients||[]).map(i => i.n).join(" ") + " " + (r.tags||[]).join(" "));
      if (!q.split(" ").every(w => hay.includes(w))) return false;
    }
    return true;
  }).sort((a,b) => a.title.localeCompare(b.title, "fr"));

  const r = isNew ? (draft && draft.isNew ? draft : {id: uid(), isNew: true, title:"", emoji:"🍝", type:"plat", tags:[], seasons:[], time:"", servings:2, ingredients:[], steps:[], notes:"", rating:0, cooked:0}) : S.recipes.find(x => x.id === id);
  if (!r) return topbar() + `<div class="empty"><h3>Recette introuvable</h3></div>`;
  if (!draft || draft.id !== r.id) draft = JSON.parse(JSON.stringify(r));
  const t = typeOf(draft.type);
  return `<div class="top"><button class="iconbtn" data-act="back">${I.back}</button><h2 style="font-size:22px;flex:1">${isNew ? "Nouvelle recette" : "Modifier"}</h2><button class="btn sm" data-act="save">Enregistrer</button></div>
  <div class="form fade">
    ${isNew ? `<div class="card qa"><b>✨ Ajout rapide</b><div class="muted" style="font-weight:600;font-size:14px;margin:4px 0 12px">Colle le texte d'une recette ou récupère celui d'une photo : le formulaire se remplit tout seul.</div>
      <div class="row"><button type="button" class="btn sm" data-act="photo-text">📷 Depuis une photo</button><button type="button" class="btn ghost sm" data-act="paste">📋 Coller un texte</button></div>
      <div class="hint" id="ocrst"></div></div>` : ""}
    <div class="photo-pick"><div class="pv" id="pv" style="--g:${t.g};--gl:${t.gl}">${draft.photo ? `<img src="${esc(draft.photo)}" alt="">` : esc(draft.emoji)}</div>
      <div class="row" style="flex-direction:column;align-items:flex-start;gap:8px">
        <label class="btn ghost sm" style="cursor:pointer">📷 ${draft.photo ? "Changer la photo" : "Ajouter une photo"}<input type="file" accept="image/*" id="photo" hidden></label>
        ${draft.photo ? `<button class="btn ghost sm" data-act="nophoto">Retirer la photo</button>` : ""}
      </div></div>
    ${!draft.photo ? `<div class="field"><label>Ou un emoji</label><div class="emojis">${EMOJIS.map(e => `<button type="button" class="${draft.emoji === e ? "on" : ""}" data-act="emoji" data-v="${e}">${e}</button>`).join("")}</div></div>` : ""}
    <div class="field"><label>Nom de la recette</label><input class="in" id="f-title" value="${esc(draft.title)}" placeholder="Ex. Lasagnes de Mamie"></div>
    <div class="field"><label>Catégorie</label><div class="chips wrap-c">${TYPES.map(x => `<button type="button" class="chip ${draft.type === x.id ? "on" : ""}" data-act="ftype" data-v="${x.id}">${x.emoji} ${x.label.replace(/s$/,"")}</button>`).join("")}</div></div>
    <div class="field"><label>Étiquettes</label><div class="chips wrap-c">${TAGS.map(x => `<button type="button" class="chip acc ${draft.tags.includes(x.id) ? "on" : ""}" data-act="ftag" data-v="${x.id}">${x.e} ${x.id}</button>`).join("")}</div></div>
    <div class="field"><label>Saison</label><div class="chips wrap-c">${SEASONS.map(x => `<button type="button" class="chip acc ${(draft.seasons||[]).includes(x.id) ? "on" : ""}" data-act="fseason" data-v="${x.id}">${x.e} ${x.label}</button>`).join("")}</div>
      <div class="hint">Rien de coché : la recette se fait toute l'année.</div></div>
    <div class="two">
      <div class="field"><label>Temps (min)</label><input class="in" id="f-time" type="number" inputmode="numeric" min="0" value="${esc(draft.time)}"></div>
      <div class="field"><label>Pour combien</label><input class="in" id="f-serv" type="number" inputmode="numeric" min="1" value="${esc(draft.servings)}"></div>
    </div>
    <div class="field"><label>Ingrédients</label><textarea class="in" id="f-ing" placeholder="Un par ligne, ex.&#10;500 g mascarpone&#10;4 oeufs&#10;2 c.à.s cacao">${esc(ingToText(draft.ingredients))}</textarea>
      <div class="hint">Un ingrédient par ligne : quantité, unité, puis nom. Les quantités s'adaptent au nombre de personnes.</div></div>
    <div class="field"><label>Étapes</label><textarea class="in" id="f-steps" style="min-height:180px" placeholder="Une étape par ligne">${esc((draft.steps||[]).join("\n"))}</textarea></div>

function readDraft(){
  if (!draft) return;
  const v = id => { const el = document.getElementById(id); return el ? el.value : null; };
  if (v("f-title") != null){
    draft.title = v("f-title").trim();
    draft.time = parseInt(v("f-time")) || "";
    draft.servings = parseInt(v("f-serv")) || 2;
    draft.ingredients = v("f-ing").split("\n").map(parseIngredient).filter(Boolean);
    draft.steps = v("f-steps").split("\n").map(s => s.trim()).filter(Boolean);
    draft.notes = v("f-notes").trim();
  }
}
function allIngredients(){
  const m = new Map();
  S.recipes.forEach(r => (r.ingredients||[]).forEach(i => { const k = key(i.n); if (!m.has(k)) m.set(k, {k, n: i.n, c: 0}); m.get(k).c++; }));
  const keys = [...m.keys()];
  return [...m.values()].filter(x => !keys.some(k => k !== x.k && x.k.startsWith(k + " "))).sort((a,b) => b.c - a.c || a.n.localeCompare(b.n, "fr"));
}
function pageFrigo(){
  const have = new Set(S.have);
  const staples = new Set((S.pantry.staples || DEFAULT_STAPLES).map(key));
  const all = allIngredients();
  const nameOf = k => (all.find(x => x.k === k) || {n: k}).n;
  const scored = S.recipes.map(r => {
    const need = (r.ingredients||[]).filter(i => !staples.has(key(i.n)));
    const ok = need.filter(i => { const k = key(i.n); return have.has(k) || [...have].some(h => k.includes(h) || h.includes(k)); });
    const miss = need.filter(i => !ok.includes(i));
    return {r, pct: need.length ? ok.length / need.length : 1, miss};
  });
  const ready = scored.filter(x => x.miss.length === 0 && have.size);
  const almost = scored.filter(x => x.miss.length > 0 && x.miss.length <= 2 && x.pct >= .5).sort((a,b) => a.miss.length - b.miss.length);
  const q = key(S.frigoQ);
  const sugg = all.filter(x => !have.has(x.k) && !staples.has(x.k) && (!q || x.k.includes(q))).slice(0, q ? 20 : 24);
  const resCard = x => `<a class="rc" href="#/recette/${esc(x.r.id)}" style="display:flex;align-items:center;gap:14px;padding:12px">
      <div class="thumb" style="--g:${typeOf(x.r.type).g};--gl:${typeOf(x.r.type).gl};width:72px;height:72px;aspect-ratio:auto;border-radius:18px;flex:none">${x.r.photo ? `<img src="${esc(x.r.photo)}" alt="">` : `<span class="em" style="font-size:36px">${esc(x.r.emoji || typeOf(x.r.type).emoji)}</span>`}</div>
      <div style="flex:1;min-width:0"><h4>${esc(x.r.title)}</h4>
        ${x.miss.length ? `<div class="miss">Il manque : ${x.miss.map(i => esc(i.n)).join(", ")}</div>` : `<div class="miss" style="color:var(--basil)">Tout est là, c'est parti !</div>`}
        <div class="pbar"><i style="width:${Math.round(x.pct*100)}%"></i></div></div>
      ${x.miss.length ? `<button class="iconbtn" data-act="courses-miss" data-v="${esc(x.r.id)}" data-miss="${esc(JSON.stringify(x.miss.map(i => i.n)))}" aria-label="Ajouter aux courses">🛒</button>` : ""}</a>`;
  return topbar() + `
    <div class="greet" style="margin-bottom:6px"><h1>Avec ce qu'on a,<br><em>on cuisine quoi&nbsp;?</em></h1></div>
    <p class="muted" style="margin:0 0 16px;font-weight:600">Dites ce que vous avez sous la main maintenant, on vous montre les recettes possibles. Rien n'est enregistré : à chaque fois, on repart de zéro.</p>
    <form class="search" id="frigoForm">${I.search}<input id="fq" placeholder="J'ai… (ex. oeufs, citron)" value="${esc(S.frigoQ)}" autocomplete="off"></form>
    ${have.size ? `<div class="sec" style="margin-top:22px"><h2 style="font-size:18px">J'ai (${have.size})</h2><a href="#" data-act="clearhave">Recommencer</a></div>
      <div class="chips wrap-c">${[...have].map(k => `<button class="chip ok on" data-act="unhave" data-v="${esc(k)}">${esc(nameOf(k))} <span class="x">×</span></button>`).join("")}</div>` : ""}
    <div class="sec" style="margin-top:22px"><h2 style="font-size:18px">${q ? "Résultats" : "Touchez ce que vous avez"}</h2></div>
    <div class="chips wrap-c">${sugg.map(x => `<button class="chip" data-act="have" data-v="${esc(x.k)}">+ ${esc(x.n)}</button>`).join("")}
      ${q && !all.some(x => x.k === q) ? `<button class="chip ok" data-act="have" data-v="${esc(q)}">+ ${esc(S.frigoQ)}</button>` : ""}</div>
    <div class="sec"><h2>🍳 On peut faire</h2></div>
    ${ready.length ? `<div class="stack">${ready.map(resCard).join("")}</div>` : `<div class="card muted" style="font-weight:600">${have.size ? "Rien de complet pour l'instant. Regardez juste en dessous !" : "Ajoutez quelques ingrédients pour voir les idées 👆"}</div>`}
    ${almost.length ? `<div class="sec"><h2>🛒 Presque !</h2></div><div class="stack">${almost.map(resCard).join("")}</div>` : ""}
    <div class="sec"><h2 style="font-size:18px">🧂 Toujours dans le placard</h2></div>
    <p class="muted" style="margin:-6px 0 10px;font-weight:600;font-size:14px">Ces basiques sont ignorés dans le calcul.</p>
    <div class="chips wrap-c">${[...(S.pantry.staples||DEFAULT_STAPLES)].map(s => `<button class="chip" data-act="unstaple" data-v="${esc(s)}">${esc(s)} <span class="x">×</span></button>`).join("")}
      <button class="chip" data-act="addstaple">+ Ajouter</button></div>`;
}

/* ======================= Router ======================= */
function render(){
  if (!S.user){ return; }
  document.body.classList.remove("immersive");
  const h = location.hash.replace(/^#\/?/, "");
  const [route, arg] = h.split("/");
  if (route === "edit" && document.getElementById("f-title") && draft) return; // ne pas écraser un formulaire en cours
  const active = document.activeElement && document.activeElement.id;
  const caret = active && document.activeElement.selectionStart;
  let html;
  switch(route){
    case "recettes": html = pageList(); break;
    case "recette": html = pageRecipe(decodeURIComponent(arg||"")); break;
    case "edit": html = pageEdit(decodeURIComponent(arg||"new")); break;
    case "frigo": html = pageFrigo(); break;
    case "rappels": html = pageRappels(); break;
    case "compte": html = pageCompte(); break;
    default: html = pageHome();
  }
  $("#app").innerHTML = `<div class="wrap">${html}</div>` + (["edit","compte"].includes(route) ? "" : nav(route === "recette" ? "recettes" : route || ""));
  if (active && document.getElementById(active) && ["q","fq"].includes(active)){ const el = document.getElementById(active); el.focus(); try { el.setSelectionRange(caret, caret); } catch(e){} }
  bindInputs();
}
let lastRoute = "";
window.addEventListener("hashchange", () => {
  const r = location.hash.split("/")[1] || "";
  if (!location.hash.startsWith("#/edit")) draft = null;
  if (r !== lastRoute) window.scrollTo(0, 0);
  lastRoute = r;
  if (r === "recette"){ const rec = S.recipes.find(x => x.id === decodeURIComponent(location.hash.split("/")[2]||"")); if (rec) track("view_recipe", {recipe: rec.title}); }
  render();
});

function bindInputs(){
  const q = $("#q"); if (q) q.oninput = e => { S.q = e.target.value; const list = filtered(); const res = $("#results"); if (res) res.innerHTML = list.length ? `<div class="grid">${list.map(card).join("")}</div>` : `<div class="empty"><div class="e">🔍</div><h3>Aucune recette trouvée</h3></div>`; const c = document.querySelector(".sec h2.muted"); if (c) c.textContent = list.length + " recette" + (list.length > 1 ? "s" : ""); };
  const fq = $("#fq"); if (fq) fq.oninput = e => { S.frigoQ = e.target.value; render(); };
  const ff = $("#frigoForm"); if (ff) ff.onsubmit = e => { e.preventDefault(); const k = key(S.frigoQ); if (k){ const all = allIngredients(); const m = all.find(x => x.k.includes(k)); addHave(m ? m.k : k); S.frigoQ = ""; } };
  document.querySelectorAll("[data-photo-for]").forEach(inp => inp.onchange = async e => {
    const f = e.target.files[0]; if (!f) return;
    const r = S.recipes.find(x => x.id === inp.dataset.photoFor); if (!r) return;
    toast("Envoi de la photo…");
    const photo = await compressImage(f);
    try { await backend.saveRecipe({...r, photo, updatedAt: Date.now()}); toast("Photo mise à jour 📸"); }
    catch(err){ toast("Erreur : " + err.message); }
  });
  const co = $("#clockon"); if (co) co.onchange = () => { store.set("clockTimer", co.checked); toast(co.checked ? "Minuteurs Horloge activés ⏱" : "Désactivé"); };
  const oc = $("#ocr"); if (oc) oc.onchange = async e => {
    const f = e.target.files[0]; if (!f) return;
    readDraft(); const st = $("#ocrst");
    st.textContent = "Chargement du module de lecture… (la première fois peut prendre un moment)";
    try { const text = await ocrImage(f, p => { const x = $("#ocrst"); if (x) x.textContent = "Lecture de la page… " + p + " %"; }); applyParsed(parseRecipeText(text)); }
    catch(err){ const x = $("#ocrst"); if (x) x.textContent = "Lecture impossible : " + err.message; }
  };
  const ph = $("#photo"); if (ph) ph.onchange = async e => { const f = e.target.files[0]; if (!f) return; readDraft(); toast("Compression de la photo…"); draft.photo = await compressImage(f); const el = $("#f-title"); el && el.remove(); render(); };
}
function addHave(k){ S.have = [...new Set([...S.have, k])]; S.frigoQ = ""; render(); }

/* ======================= Actions ======================= */
document.addEventListener("click", async e => {
  const ts = e.target.closest("[data-tstop]");
  if (ts){ e.preventDefault(); TIMERS = TIMERS.filter(t => t.id !== ts.dataset.tstop); saveTimers(); drawTimers(); return; }
  const el = e.target.closest("[data-act]"); if (!el) return;
  const act = el.dataset.act, v = el.dataset.v;
  const curId = decodeURIComponent((location.hash.split("/")[2]) || "");
  const cur = () => S.recipes.find(r => r.id === curId);
  switch(act){
    case "theme": { const t = document.documentElement.dataset.theme === "dark" ? "light" : "dark"; document.documentElement.dataset.theme = t; store.set("theme", t); break; }
    case "back": e.preventDefault(); if (history.length > 1) history.back(); else location.hash = "#/"; break;
    case "type": e.preventDefault(); S.fType = S.fType === v && location.hash.startsWith("#/recettes") ? "" : v; if (!location.hash.startsWith("#/recettes")){ S.fTags = []; S.fSeason = ""; S.q = ""; location.hash = "#/recettes"; } else render(); break;
    case "tag": e.preventDefault(); if (!location.hash.startsWith("#/recettes")){ S.fTags = [v]; S.fType = ""; S.fSeason = ""; S.q = ""; location.hash = "#/recettes"; } else { S.fTags = S.fTags.includes(v) ? S.fTags.filter(x => x !== v) : [...S.fTags, v]; render(); } break;
    case "seed": await backend.importSeed(); toast("Recettes chargées 🎉"); break;
    case "serv": { const r = cur(); const s = (S.servings[curId] || r.servings || 2) + (+v); S.servings[curId] = Math.max(1, Math.min(40, s)); render(); break; }
    case "check": { const k = +v; const c = S.checked[curId] || []; S.checked[curId] = c.includes(k) ? c.filter(x => x !== k) : [...c, k]; render(); break; }
    case "rate": { const r = cur(); await backend.saveRecipe({...r, rating: +v === r.rating ? 0 : +v}); break; }
    case "fav": { const r = S.recipes.find(x => x.id === v); const tags = r.tags || []; await backend.saveRecipe({...r, tags: tags.includes("Favorite") ? tags.filter(t => t !== "Favorite") : [...tags, "Favorite"]}); break; }
    case "cooked": { const r = cur(); await backend.saveRecipe({...r, cooked: (r.cooked||0) + 1, lastCooked: Date.now()}); toast("Miam ! Notée comme refaite 😋"); track("cooked", {recipe: r.title}); break; }
    case "cook": openCook(S.recipes.find(r => r.id === v)); break;
    case "emoji": readDraft(); draft.emoji = v; draft.photo = ""; redrawEdit(); break;
    case "nophoto": readDraft(); draft.photo = ""; redrawEdit(); break;
    case "ftype": readDraft(); draft.type = v; redrawEdit(); break;
    case "fseason": readDraft(); { const ss = draft.seasons || []; draft.seasons = ss.includes(v) ? ss.filter(x => x !== v) : [...ss, v]; } redrawEdit(); break;
    case "season": e.preventDefault(); if (!location.hash.startsWith("#/recettes")){ S.fSeason = v; S.fTags = []; S.fType = ""; S.q = ""; location.hash = "#/recettes"; } else { S.fSeason = S.fSeason === v ? "" : v; render(); } break;
    case "ftag": readDraft(); draft.tags = draft.tags.includes(v) ? draft.tags.filter(x => x !== v) : [...draft.tags, v]; redrawEdit(); break;
    case "save": {
      readDraft();
      if (!draft.title){ toast("Il manque le nom de la recette"); $("#f-title").focus(); return; }

function compressImage(file){
  return new Promise(res => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const max = 1000, s = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement("canvas"); c.width = Math.round(img.width*s); c.height = Math.round(img.height*s);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      let q = .8, out = c.toDataURL("image/jpeg", q);
      while (out.length > 600000 && q > .35){ q -= .1; out = c.toDataURL("image/jpeg", q); }
      URL.revokeObjectURL(url); res(out);
    };
    img.src = url;
  });
}

let TIMERS = store.get("timers", []);
let actx = null;
const saveTimers = () => store.set("timers", TIMERS);
function unlockAudio(){ try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); if (actx.state === "suspended") actx.resume(); } catch(e){} }
function beep(){
  try {
    unlockAudio(); const t0 = actx.currentTime;
    for (let k = 0; k < 8; k++){
      const o = actx.createOscillator(), g = actx.createGain();
      o.frequency.value = k % 2 ? 660 : 880; o.connect(g); g.connect(actx.destination);
      const st = t0 + k * 0.32;
      g.gain.setValueAtTime(0.0001, st); g.gain.exponentialRampToValueAtTime(0.5, st + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, st + 0.28);
      o.start(st); o.stop(st + 0.3);
    }
  } catch(e){}
  try { navigator.vibrate && navigator.vibrate([300,150,300,150,300]); } catch(e){}
}
function parseDurations(text){
  const out = [], seen = new Set();
  const re = /(\d+(?:[.,]\d+)?)\s*(?:(?:à|a|-)\s*\d+(?:[.,]\d+)?\s*)?(heures?|h|minutes?|min|mn|secondes?|sec)(?![a-zé])(?:\s*(\d{1,2})(?!\s*(?:min|h|g|cl|ml)))?/gi;
  let m;
  while ((m = re.exec(text))){
    const n = parseFloat(m[1].replace(",", ".")), u = m[2].toLowerCase(), extra = m[3] ? +m[3] : 0;
    let sec, label;
    if (u.startsWith("h")){ sec = n*3600 + extra*60; label = extra ? `${n} h ${String(extra).padStart(2,"0")}` : `${n} h`; }
    else if (u.startsWith("s")){ sec = n; label = `${n} s`; }
    else { sec = n*60; label = `${n} min`; }
    if (sec > 0 && sec <= 48*3600 && !seen.has(sec)){ seen.add(sec); out.push({sec, label}); }
  }
  return out;
}
function fmtLeft(ms){ let x = Math.max(0, Math.round(ms/1000)); const h = Math.floor(x/3600); x %= 3600; const m = Math.floor(x/60); const sx = x % 60; return h ? `${h} h ${String(m).padStart(2,"0")}` : `${m}:${String(sx).padStart(2,"0")}`; }
function startTimer(sec, label){
  unlockAudio(); TIMERS.push({id: uid(), label, end: Date.now() + sec*1000, rang: false}); saveTimers(); drawTimers(); toast("Minuteur lancé ⏱");
  if (isIOS() && store.get("clockTimer", false)){

  }
}

/* ======================= Ajout rapide ======================= */
function parseRecipeText(raw){
  let lines = raw.replace(/\r/g, "").split("\n").map(l => l.replace(/\s+/g, " ").trim()).filter(Boolean);
  const out = {title:"", servings:null, time:null, ingredients:[], steps:[]};
  const all = lines.join(" ");
  const sv = all.match(/(\d{1,2})\s*(?:personnes?|pers\.?|parts?|portions?)\b/i); if (sv) out.servings = +sv[1];
  const tp = all.match(/pr[ée]paration\s*:?\s*(\d+)\s*(min|h)/i) || all.match(/temps total\s*:?\s*(\d+)\s*(min|h)/i);
  if (tp) out.time = /h/i.test(tp[2]) ? +tp[1]*60 : +tp[1];
  const isIngH = l => /^ingr[ée]dients?\b/i.test(l);
  const isStepH = l => /^(pr[ée]paration|[ée]tapes?|instructions?|m[ée]thode|r[ée]alisation)\s*:?\s*$/i.test(l);
  const meta = l => l.length < 60 && /^[*•\-\s]*(temps|pr[ée]paration|cuisson|repos|difficult|co[uû]t|budget|portions?|nombre|pour \d|\d+\s*(personnes|pers))/i.test(l) && /\d|:|-/.test(l);
  const qOnly = /^(\d+(?:[.,]\d+)?|[½¼¾])\s*(kg|g|mg|ml|cl|dl|l|c\.?\s?à\.?\s?[sc]\.?)?$/i;
  const looksIng = l => l.length < 70 && !/^\d+\s*[.)]\s/.test(l) && (/^[-•*·]\s*/.test(l) || /^(\d+(?:[.,]\d+)?|[½¼¾])\s*\S/.test(l));
  const iI = lines.findIndex(isIngH), iS = lines.findIndex(isStepH);
  let head = [], ingL = [], stepL = [];
  if (iI >= 0){
    head = lines.slice(0, iI);
    if (iS > iI){ ingL = lines.slice(iI+1, iS); stepL = lines.slice(iS+1); }
    else { let inSteps = false; lines.slice(iI+1).forEach((l, k, arr) => { if (!inSteps && (looksIng(l) || qOnly.test(l) || (k > 0 && qOnly.test(arr[k-1])) || l.length < 40)) ingL.push(l); else { inSteps = true; stepL.push(l); } }); }
  } else {
    lines.forEach(l => { if (looksIng(l) || qOnly.test(l)) ingL.push(l); else if (l.length > 25 || /^([ée]tape|\d+\s*[.)])/i.test(l)) stepL.push(l); else head.push(l); });
  }
  // ingrédients : fusionner « 24 » + « biscuits »
  const merged = [];
  for (let k = 0; k < ingL.length; k++){
    let l = ingL[k];
    if (/^\(.*\)$/.test(l) || meta(l) || isStepH(l)) continue;
    if (qOnly.test(l) && ingL[k+1] && !qOnly.test(ingL[k+1])){ l = l + " " + ingL[k+1]; k++; }
    merged.push(l.replace(/\s*\((environ|facultatif)\)\s*/i, " ").trim());
  }
  out.ingredients = merged.map(parseIngredient).filter(Boolean);
  const steps = [];
  stepL.forEach(l => {
    if (meta(l) || isIngH(l) || isStepH(l)) return;
    const mm = l.match(/^(?:[ée]tape\s*\d+\s*[:.\-]?|\d+\s*[.)\-:]\s+)(.*)$/i);
    if (mm){ steps.push(mm[1].trim()); return; }
    const last = steps[steps.length-1];
    if (last === "") steps[steps.length-1] = l;
    else if (last && !/[.!?)]$/.test(last)) steps[steps.length-1] = last + " " + l;
    else steps.push(l);
  });
  out.steps = steps.filter(Boolean);
  out.title = (head.find(l => !meta(l) && l.length >= 3 && l.length <= 80 && !/^(recette|accueil|menu)$/i.test(l)) || "").replace(/^recette\s*(de|du|des)?\s*:?\s*/i, "");
  return out;
}

      <div class="field"><label>Emoji</label><div class="emojis">${OCC_EMOJIS.map(e => `<button type="button" class="${o.emoji === e ? "on" : ""}" data-e="${e}">${e}</button>`).join("")}</div></div>
      <div class="field"><label>Occasion</label><input class="in" id="o-t" value="${esc(o.title)}" placeholder="Ex. Anniversaire de Julien" required></div>
      <div class="two"><div class="field"><label>Jour</label><input class="in" id="o-d" type="number" min="1" max="31" value="${o.day}"></div>
        <div class="field"><label>Mois</label><select class="in" id="o-m">${MONTHS.map((mo,i) => `<option value="${i+1}" ${o.month === i+1 ? "selected" : ""}>${mo}</option>`).join("")}</select></div></div>
      <div class="field"><label>Recette</label><select class="in" id="o-r"><option value="">Aucune</option>${recs.map(r => `<option value="${esc(r.id)}" ${o.recipeId === r.id ? "selected" : ""}>${esc(r.emoji || "")} ${esc(r.title)}</option>`).join("")}</select></div>
      <div class="field"><label>Me prévenir</label><select class="in" id="o-x">${[1,2,3,5,7].map(n => `<option value="${n}" ${o.remind === n ? "selected" : ""}>${n} jour${n > 1 ? "s" : ""} avant</option>`).join("")}</select></div>
      <button class="btn wide">Enregistrer</button>
      ${id !== "new" ? `<button type="button" class="btn danger wide" id="o-del">Supprimer</button>` : ""}
    </form>`);
  m.querySelectorAll("[data-e]").forEach(b => b.onclick = () => { o.emoji = b.dataset.e; m.querySelectorAll("[data-e]").forEach(x => x.classList.toggle("on", x === b)); });
  m.querySelector("#of").onsubmit = async e => {
    e.preventDefault();
    const occ = {...o, title: m.querySelector("#o-t").value.trim(), day: Math.max(1, Math.min(31, +m.querySelector("#o-d").value || 1)), month: +m.querySelector("#o-m").value, recipeId: m.querySelector("#o-r").value, remind: +m.querySelector("#o-x").value};
    if (!occ.title) return;
    closeModal(); await backend.saveOcc(occ); toast("Rendez-vous enregistré 🎉");
  };
  const del = m.querySelector("#o-del"); if (del) del.onclick = async () => { closeModal(); await backend.deleteOcc(o.id); toast("Supprimé"); };
}
function downloadIcs(o){
  const r = S.recipes.find(x => x.id === o.recipeId);
  const d = nextDate(o.day, o.month);
  const p = n => String(n).padStart(2, "0");
  const ds = `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}`;
  const de = new Date(d.getTime() + 86400000);
  const dEnd = `${de.getFullYear()}${p(de.getMonth()+1)}${p(de.getDate())}`;
  const stamp = new Date().toISOString().replace(/[-:]/g,"").replace(/\.\d+/,"");
  const icsEsc = s => String(s).replace(/[,;\\]/g, m => "\\" + m);
  const ics = ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Popote//FR","BEGIN:VEVENT",
    `UID:${o.id}@popote`,`DTSTAMP:${stamp}`,`DTSTART;VALUE=DATE:${ds}`,`DTEND;VALUE=DATE:${dEnd}`,"RRULE:FREQ=YEARLY",
    `SUMMARY:${icsEsc((o.emoji||"🎂") + " " + o.title + (r ? " : " + r.title : ""))}`,
    `DESCRIPTION:${icsEsc(r ? "Penser aux courses pour : " + r.title : "Rendez-vous gourmand")}`,
    "BEGIN:VALARM","ACTION:DISPLAY",`DESCRIPTION:${icsEsc((r ? r.title : o.title) + " dans " + (o.remind||3) + " jours, pensez aux courses !")}`,`TRIGGER:-P${o.remind||3}D`,"END:VALARM",
    "END:VEVENT","END:VCALENDAR"].join("\r\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([ics], {type:"text/calendar"}));
  a.download = (o.title || "rappel").replace(/[^\w-]+/g, "-") + ".ics";
  a.click();
  toast("Ouvrez le fichier pour l'ajouter au calendrier 📅");
}

/* ======================= Mode cuisine ======================= */
let wake = null;
const STOPW = new Set(["de","du","des","la","le","les","pour","au","aux","en","et","non","d'","l'","a"]);
const SYN = {oeuf:["jaune","blanc","oeuf"], biscuit:["biscuit","boudoir"], pate:["pate","spaghetti"]};
function stepIngredients(r, text){
  const t = " " + key(text) + " ";
  const groups = new Map();
  (r.ingredients||[]).forEach((i, idx) => {
    const k = key(i.n);
    const words = k.split(" ").filter(w => w.length > 2 && !STOPW.has(w));
    const main = words[0] || k;
    const cands = [k, main, ...(SYN[main] || [])];
    if (!cands.some(c => c && t.includes(" " + c))) return;
    const score = words.slice(1).filter(w => t.includes(" " + w)).length;
    const g = groups.get(main);
    if (!g || score > g.score) groups.set(main, {i, idx, score});
  });
  return [...groups.values()].sort((a,b) => a.idx - b.idx).map(g => g.i);
}
async function openCook(r){
  if (!r || !(r.steps||[]).length) return toast("Pas encore d'étapes pour cette recette");
  try { wake = await navigator.wakeLock.request("screen"); } catch(e){}
  let i = 0, showAll = false;
  const sv = S.servings[r.id] || r.servings || 2;
  const factor = sv / (r.servings || sv);
  const box = document.createElement("div"); box.className = "cook"; box.id = "cook"; document.body.appendChild(box);
  document.body.classList.add("immersive");
  const chip = ing => { const l = ingLine(ing, factor); return `<div class="${l.q ? "" : "noq"}"><b>${esc(l.q || "✓")}</b><span>${esc(l.n)}</span></div>`; };
  const draw = () => {
    const need = stepIngredients(r, r.steps[i]);
    box.innerHTML = `<div class="hd"><button class="iconbtn" id="cx" aria-label="Fermer">${I.x}</button><div class="prog">${r.steps.map((_, k) => `<i class="${k <= i ? "on" : ""}"></i>`).join("")}</div><button class="allbtn" id="ca">🧾 Ingrédients</button></div>
      <div class="mid fade"><div class="n">Étape ${i+1} sur ${r.steps.length} · ${sv} pers.</div><div class="st">${esc(r.steps[i])}</div>
        ${(b => b ? `<div class="row" style="margin-top:22px">${b}</div>` : "")(timerBtns(r.steps[i], r.title + " · étape " + (i+1), "btn ink"))}
        ${need.length ? `<div class="need"><h4>Pour cette étape</h4><div class="ingc">${need.map(chip).join("")}</div></div>` : ""}</div>
      <div class="ft"><button class="btn ghost" id="cp" ${i === 0 ? 'style="visibility:hidden"' : ""}>Précédente</button>
      <button class="btn" id="cn">${i === r.steps.length - 1 ? "Bon appétit ! 🎉" : "Suivante"}</button></div>
      ${showAll ? `<div class="panel"><h3>Tous les ingrédients <button class="iconbtn" id="cpx" aria-label="Fermer">${I.x}</button></h3><div class="muted" style="font-weight:600;margin-bottom:6px">Pour ${sv} personnes</div>
        <ul class="ings">${(r.ingredients||[]).map(ing => { const l = ingLine(ing, factor); return `<li style="cursor:default"><span class="q">${esc(l.q)}</span><span>${esc(l.n)}</span></li>`; }).join("")}</ul></div>` : ""}`;
    box.querySelector("#cx").onclick = close;
    box.querySelector("#ca").onclick = () => { showAll = !showAll; draw(); };
    const px = box.querySelector("#cpx"); if (px) px.onclick = () => { showAll = false; draw(); };
    box.querySelector("#cp").onclick = () => { i = Math.max(0, i-1); draw(); };
    box.querySelector("#cn").onclick = () => { if (i === r.steps.length - 1) close(); else { i++; draw(); } };
  };
  const close = () => { box.remove(); document.body.classList.remove("immersive"); try { wake && wake.release(); } catch(e){} };
  draw();
}
